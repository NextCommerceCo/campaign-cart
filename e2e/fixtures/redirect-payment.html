<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="next-api-key" content="test-e2e-key" />
    <!-- Where the SDK sends a shopper whose order came back already paid. This
         fixture stands in for the thank-you page, so the negative control can
         tell "went to the gateway" from "went to the success page". -->
    <meta
      name="next-success-url"
      content="/e2e/fixtures/redirect-payment.html"
    />
    <title>E2E — redirect payment methods</title>
    <!-- Analytics is off by default; auto mode is what registers the checkout
         handlers, and `dl_add_payment_info` is part of what this journey owes. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.nextConfig = {
        analytics: {
          enabled: true,
          mode: 'auto',
          providers: { gtm: { enabled: true } },
        },
      };
    </script>
  </head>
  <body>
    <h1>Redirect payment fixture</h1>

    <!-- No docs:example marker: the checkout form's published example lives in
         checkout-form.html. This fixture drives the *journey* a redirect method
         takes — pick the radio, submit, get sent to the payment page — and
         carries only the markup that journey needs. -->
    <form data-next-checkout>
      <input data-next-checkout-field="email" name="email" type="email" />
      <input data-next-checkout-field="fname" name="fname" />
      <input data-next-checkout-field="lname" name="lname" />
      <input data-next-checkout-field="address1" name="address1" />
      <input data-next-checkout-field="city" name="city" />
      <input data-next-checkout-field="postal" name="postal" />
      <input data-next-checkout-field="phone" name="phone" type="tel" />
      <select data-next-checkout-field="country" name="country">
        <option value="US">United States</option>
      </select>
      <select data-next-checkout-field="province" name="province">
        <option value="NY">New York</option>
      </select>

      <!-- One wrapper per way to pay: the radio the shopper presses, and the
           fields that method needs. A redirect method has none — everything is
           collected on the payment page it sends the shopper to. -->
      <div data-next-payment-method="credit_card">
        <input
          type="radio"
          name="payment_method"
          value="credit_card"
          id="pm-credit"
          checked
        />
        <label for="pm-credit">Card</label>
        <div data-next-payment-form></div>
      </div>
      <div data-next-payment-method="ideal">
        <input type="radio" name="payment_method" value="ideal" id="pm-ideal" />
        <label for="pm-ideal">iDEAL</label>
        <div data-next-payment-form></div>
      </div>
      <!-- The one name SEPA answers to. The platform's payment-methods guide
           calls the same method `sepa_direct`, which is not accepted. -->
      <div data-next-payment-method="sepa_debit">
        <input
          type="radio"
          name="payment_method"
          value="sepa_debit"
          id="pm-sepa"
        />
        <label for="pm-sepa">SEPA Direct Debit</label>
        <div data-next-payment-form></div>
      </div>
      <!-- The guide's name for the same method, which is not accepted. Here so a
           spec can prove it is never translated into `sepa_debit`. -->
      <div data-next-payment-method="sepa_direct">
        <input
          type="radio"
          name="payment_method"
          value="sepa_direct"
          id="pm-sepa-guide"
        />
        <label for="pm-sepa-guide">SEPA (guide name)</label>
        <div data-next-payment-form></div>
      </div>

      <!-- A method this SDK build has no name for. The store may still offer it,
           so it has to reach the API rather than being read as a card. -->
      <div data-next-payment-method="pix">
        <input type="radio" name="payment_method" value="pix" id="pm-pix" />
        <label for="pm-pix">Pix</label>
        <div data-next-payment-form></div>
      </div>

      <button type="submit" data-next-checkout-submit>Complete order</button>
    </form>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
