    <!-- docs:example A tooltip on a button -->
    <!-- delay=0 so the tooltip shows immediately on hover/focus. -->

      id="target"
      data-next-tooltip="Helpful text"
      data-next-tooltip-placement="top"
      data-next-tooltip-delay="0"
