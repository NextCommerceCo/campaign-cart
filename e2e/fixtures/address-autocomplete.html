<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="next-api-key" content="test-e2e-key" />
    <title>E2E — Address autocomplete</title>
  </head>
  <body>
    <h1>Address autocomplete fixture</h1>

    <!-- address-autocomplete is not DOM-scanned; it is created inside
         CheckoutFormEnhancer and lazy-loads the NextCommerce provider on the
         first focus of the address1 field. -->
    <form data-next-checkout>
      <div class="form-group">
        <label for="address1">Address</label>
        <input
          type="text"
          id="address1"
          data-next-checkout-field="address1"
          name="address1"
        />
      </div>
      <div class="form-group">
        <label for="city">City</label>
        <input
          type="text"
          id="city"
          data-next-checkout-field="city"
          name="city"
        />
      </div>
      <div class="form-group">
        <label for="postal">ZIP</label>
        <input
          type="text"
          id="postal"
          data-next-checkout-field="postal"
          name="postal"
        />
      </div>
    </form>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
