<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="next-api-key" content="test-e2e-key" />
    <title>E2E — country service</title>
  </head>
  <body>
    <h1>Country service fixture</h1>

    <!-- No docs:example marker: this fixture drives CountryService, which is a
         core service rather than a markup feature, so it publishes nothing.

         Each field sits in its own .form-group. Two things need one: an error
         message is appended to the field's wrapper, and a country with no
         states hides the province row by hiding its container, which without a
         wrapper is the <form> itself. -->
    <form data-next-checkout>
      <div class="form-group">
        <input data-next-checkout-field="fname" name="first_name" />
      </div>
      <div class="form-group">
        <input data-next-checkout-field="lname" name="last_name" />
      </div>
      <div class="form-group">
        <input data-next-checkout-field="email" type="email" name="email" />
      </div>
      <div class="form-group">
        <input data-next-checkout-field="address1" name="address1" />
      </div>
      <div class="form-group">
        <input data-next-checkout-field="city" name="city" />
      </div>

      <div class="form-group">
        <select data-next-checkout-field="country" name="country">
          <option value="">Select Country</option>
        </select>
      </div>

      <div class="form-group">
        <select data-next-checkout-field="province" name="province">
          <option value="">Select Country First</option>
        </select>
      </div>

      <div class="form-group">
        <input data-next-checkout-field="postal" name="postal" />
      </div>

      <button type="submit">Complete order</button>
    </form>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
