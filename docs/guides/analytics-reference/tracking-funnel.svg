<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 606" width="760" height="606" role="img" aria-labelledby="tracking-funnel-title tracking-funnel-desc" style="font-family: var(--clean-font-body, system-ui, sans-serif)">
  <title id="tracking-funnel-title">What the shopper does, and the event the SDK sends</title>
  <desc id="tracking-funnel-desc">What a shopper does on each page and the tracking event the SDK sends. Landing page: opens the page, page_viewed; sees a product, product_viewed; adds it to the cart, product_added_to_cart. Checkout page: opens the checkout, checkout_started; enters contact details, checkout_contact_info_submitted; enters a shipping address, checkout_shipping_address_submitted; gets a shipping method, checkout_shipping_method_submitted; submits the payment, checkout_payment_info_submitted; pays, checkout_completed. Upsell page: sees an offer, upsell_viewed; accepts it, upsell_completed; declines it, upsell_skipped.</desc>
  <defs>
    <marker id="funnel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--clean-fg-muted, #6b7280)" />
    </marker>
  </defs>
  <text x="190" y="28" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px; font-weight: 600; letter-spacing: 0.04em">THE SHOPPER</text>
  <text x="436" y="28" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px; font-weight: 600; letter-spacing: 0.04em">THE SDK SENDS</text>
  <rect x="10" y="44" width="740" height="120" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
  <text x="28" y="74" style="fill: var(--clean-fg, #111827); font-size: 14px; font-weight: 600">Landing page</text>
  <text x="190" y="74" style="fill: var(--clean-fg, #111827); font-size: 13px">Opens the page</text>
  <path d="M388 70 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="74" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">page_viewed</text>
  <text x="190" y="106" style="fill: var(--clean-fg, #111827); font-size: 13px">Sees a product</text>
  <path d="M388 102 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="106" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">product_viewed</text>
  <text x="190" y="138" style="fill: var(--clean-fg, #111827); font-size: 13px">Adds it to the cart</text>
  <path d="M388 134 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="138" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">product_added_to_cart</text>
  <path d="M380 169 V191" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; fill: none" />
  <rect x="10" y="198" width="740" height="216" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
  <text x="28" y="228" style="fill: var(--clean-fg, #111827); font-size: 14px; font-weight: 600">Checkout page</text>
  <text x="190" y="228" style="fill: var(--clean-fg, #111827); font-size: 13px">Opens the checkout</text>
  <path d="M388 224 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="228" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">checkout_started</text>
  <text x="190" y="260" style="fill: var(--clean-fg, #111827); font-size: 13px">Enters contact details</text>
  <path d="M388 256 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="260" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">checkout_contact_info_submitted</text>
  <text x="190" y="292" style="fill: var(--clean-fg, #111827); font-size: 13px">Enters a shipping address</text>
  <path d="M388 288 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="292" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">checkout_shipping_address_submitted</text>
  <text x="190" y="324" style="fill: var(--clean-fg, #111827); font-size: 13px">Gets a shipping method</text>
  <path d="M388 320 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="324" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">checkout_shipping_method_submitted</text>
  <text x="190" y="356" style="fill: var(--clean-fg, #111827); font-size: 13px">Submits the payment</text>
  <path d="M388 352 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="356" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">checkout_payment_info_submitted</text>
  <text x="190" y="388" style="fill: var(--clean-fg, #111827); font-size: 13px">Pays</text>
  <path d="M388 384 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="388" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">checkout_completed</text>
  <path d="M380 419 V441" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; fill: none" />
  <rect x="10" y="448" width="740" height="120" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
  <text x="28" y="478" style="fill: var(--clean-fg, #111827); font-size: 14px; font-weight: 600">Upsell page</text>
  <text x="190" y="478" style="fill: var(--clean-fg, #111827); font-size: 13px">Sees an offer</text>
  <path d="M388 474 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="478" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">upsell_viewed</text>
  <text x="190" y="510" style="fill: var(--clean-fg, #111827); font-size: 13px">Accepts it</text>
  <path d="M388 506 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="510" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">upsell_completed</text>
  <text x="190" y="542" style="fill: var(--clean-fg, #111827); font-size: 13px">Declines it</text>
  <path d="M388 538 H424" marker-end="url(#funnel-arrow)" style="stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; fill: none" />
  <text x="436" y="542" style="fill: var(--clean-accent, #2563eb); font-family: var(--clean-font-mono, ui-monospace, monospace); font-size: 13px">upsell_skipped</text>
  <text x="10" y="594" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">Each event is sent once, also when the shopper reloads or moves between the pages of a checkout.</text>
</svg>
