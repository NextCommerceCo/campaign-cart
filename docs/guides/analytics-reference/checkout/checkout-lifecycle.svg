<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 642" width="720" height="642" role="img" aria-labelledby="checkout-tracking-lifecycle-title checkout-tracking-lifecycle-desc" style="font-family: var(--clean-font-body, system-ui, sans-serif)">
  <title id="checkout-tracking-lifecycle-title">Checkout tracking</title>
  <desc id="checkout-tracking-lifecycle-desc">Each event comes once per checkout. checkout.started sends checkout_started (dl_begin_checkout); when the page that started the checkout was left before it was sent, the next checkout page sends it. user.created sends checkout_contact_info_submitted (dl_generate_lead). The other three wait for checkout_started. A valid shipping address (address.entered) sends checkout_shipping_address_submitted, and checkout_shipping_method_submitted follows when the cart is priced with a shipping method: at once when it already is, else when a method picked later is priced (shipping.selected). The first of the two is sent as dl_add_shipping_info. checkout.submitted, a submit that passes its checks, sends checkout_payment_info_submitted (dl_add_payment_info).</desc>
  <defs>
    <marker id="checkout-tracking-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--clean-fg-muted, #6b7280)" />
    </marker>
  </defs>
  <g>
    <rect x="8" y="31.5" width="150" height="57" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="83" y="49.5" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the checkout starts,</text>
    <text x="83" y="64.5" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">or its next page when</text>
    <text x="83" y="79.5" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">this one was left</text>
    <text x="83" y="104.5" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout.started</text>
    <path d="M158 60 H184" marker-end="url(#checkout-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <rect x="8" y="167" width="150" height="42" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="83" y="185" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the contact details</text>
    <text x="83" y="200" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">save an Open Cart</text>
    <text x="83" y="225" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">user.created</text>
    <path d="M158 188 H184" marker-end="url(#checkout-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <rect x="8" y="287.5" width="150" height="42" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="83" y="305.5" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the shipping address</text>
    <text x="83" y="320.5" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">is valid</text>
    <text x="83" y="345.5" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">address.entered</text>
    <path d="M158 308.5 H184" marker-end="url(#checkout-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <rect x="8" y="440.5" width="150" height="42" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="83" y="458.5" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">a method picked</text>
    <text x="83" y="473.5" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">later is priced</text>
    <text x="83" y="498.5" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">shipping.selected</text>
    <path d="M158 461.5 H184" marker-end="url(#checkout-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <rect x="8" y="561" width="150" height="42" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="83" y="579" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">a submit passes</text>
    <text x="83" y="594" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">its checks</text>
    <text x="83" y="619" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout.submitted</text>
    <path d="M158 582 H184" marker-end="url(#checkout-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <path d="M470 60 H506 V582 H476" marker-end="url(#checkout-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <path d="M506 308.5 H476" marker-end="url(#checkout-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <path d="M506 461.5 H476" marker-end="url(#checkout-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="518" y="124" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">each waits for</text>
    <text x="518" y="141" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout_started</text>
    <path d="M330 345 V419" marker-end="url(#checkout-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="380" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">the cart already has</text>
    <text x="344" y="396" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">a priced shipping method</text>
    <text x="518" y="372" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">the first of these two</text>
    <text x="518" y="388" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">is sent as</text>
    <text x="518" y="405" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">dl_add_shipping_info</text>
  </g>
  <g text-anchor="middle">
    <rect x="190" y="16" width="280" height="88" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="41" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">started</text>
    <text x="330" y="61" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout_started</text>
    <text x="330" y="76" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">once per checkout</text>
    <text x="330" y="91" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">as dl_begin_checkout</text>
    <rect x="190" y="144" width="280" height="88" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="169" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">contact</text>
    <text x="330" y="189" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout_contact_info_submitted</text>
    <text x="330" y="204" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">once per checkout</text>
    <text x="330" y="219" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">as dl_generate_lead</text>
    <rect x="190" y="272" width="280" height="73" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="297" style="fill: var(--clean-fg, #111827); font-size: 14px; font-weight: 600">shipping address</text>
    <text x="330" y="317" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout_shipping_address_submitted</text>
    <text x="330" y="332" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">once per checkout</text>
    <rect x="190" y="425" width="280" height="73" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="450" style="fill: var(--clean-fg, #111827); font-size: 14px; font-weight: 600">shipping method</text>
    <text x="330" y="470" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout_shipping_method_submitted</text>
    <text x="330" y="485" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">once per checkout</text>
    <rect x="190" y="538" width="280" height="88" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="563" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">payment</text>
    <text x="330" y="583" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout_payment_info_submitted</text>
    <text x="330" y="598" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">once per checkout</text>
    <text x="330" y="613" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">as dl_add_payment_info</text>
  </g>
</svg>
