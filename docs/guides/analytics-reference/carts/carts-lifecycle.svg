<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 628" width="720" height="628" role="img" aria-labelledby="carts-tracking-lifecycle-title carts-tracking-lifecycle-desc" style="font-family: var(--clean-font-body, system-ui, sans-serif)">
  <title id="carts-tracking-lifecycle-title">Cart tracking</title>
  <desc id="carts-tracking-lifecycle-desc">The cart is compared with the lines already reported in this tab: after every price update (cart.calculated), when the last line is removed (cart.updated), and on sdk.ready when the page opens with a priced or an empty cart. In order: product_removed_from_cart for each line the cart lost (dl_remove_from_cart), product_added_to_cart for each line it gained (dl_add_to_cart), then, on cart.calculated only, cart_updated (dl_cart_updated). The Meta pixel gets AddToCart for the first add of the tab only, the one whose first_in_session is true.</desc>
  <defs>
    <marker id="carts-tracking-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--clean-fg-muted, #6b7280)" />
    </marker>
  </defs>
  <g>
    <rect x="250" y="8" width="160" height="27" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="330" y="26" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the cart is priced</text>
    <path d="M330 35 V70" marker-end="url(#carts-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="60" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">cart.calculated</text>
    <rect x="8" y="91.5" width="150" height="42" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="83" y="109.5" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the last line</text>
    <text x="83" y="124.5" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">is removed</text>
    <text x="83" y="149.5" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">cart.updated</text>
    <path d="M158 112.5 H214" marker-end="url(#carts-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <rect x="540" y="91" width="160" height="42" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="620" y="109" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the page opens with a</text>
    <text x="620" y="124" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">priced or empty cart</text>
    <text x="620" y="149" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">sdk.ready</text>
    <path d="M540 112 H446" marker-end="url(#carts-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <path d="M330 149 V210" marker-end="url(#carts-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="179.5" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">first, each line the cart lost</text>
    <path d="M330 304 V364" marker-end="url(#carts-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="334" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">then each line it gained</text>
    <path d="M330 458 V518" marker-end="url(#carts-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="479.5" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">then, on a price update</text>
    <text x="344" y="499.5" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">cart.calculated</text>
    <path d="M440 388 H534" marker-end="url(#carts-tracking-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; stroke-dasharray: 5 4" />
    <text x="490" y="380" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the first add</text>
  </g>
  <g text-anchor="middle">
    <rect x="220" y="76" width="220" height="73" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-accent, #2563eb); stroke-width: 1.5" />
    <text x="330" y="101" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">compared</text>
    <text x="330" y="121" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">the cart, with the lines</text>
    <text x="330" y="136" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">already reported in this tab</text>
    <rect x="220" y="216" width="220" height="88" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="241" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">line removed</text>
    <text x="330" y="261" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">product_removed_from_cart</text>
    <text x="330" y="276" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">one per line</text>
    <text x="330" y="291" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">as dl_remove_from_cart</text>
    <rect x="220" y="370" width="220" height="88" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="395" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">line added</text>
    <text x="330" y="415" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">product_added_to_cart</text>
    <text x="330" y="430" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">one per line</text>
    <text x="330" y="445" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">as dl_add_to_cart</text>
    <rect x="220" y="524" width="220" height="88" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="549" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">cart updated</text>
    <text x="330" y="569" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">cart_updated</text>
    <text x="330" y="584" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">every price update</text>
    <text x="330" y="599" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">as dl_cart_updated</text>
    <rect x="540" y="370" width="160" height="73" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
    <text x="620" y="395" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">Meta pixel</text>
    <text x="620" y="415" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">AddToCart</text>
    <text x="620" y="430" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">first add of the tab</text>
  </g>
</svg>
