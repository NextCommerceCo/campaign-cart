<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 524" width="720" height="524" role="img" aria-labelledby="orders-lifecycle-title orders-lifecycle-desc" style="font-family: var(--clean-font-body, system-ui, sans-serif)">
  <title id="orders-lifecycle-title">Order lifecycle</title>
  <desc id="orders-lifecycle-desc">An order paid at once on the checkout sends order.created and order.paid there, and the shopper is redirected to the next page; an order paid at a gateway comes back to the next page. A page whose URL has ref_id or order_ref_id loads the order: order.loaded, then order.paid the first time this browser has it paid (after a gateway). If it cannot load, sdk.error. An upsell added to the order sends upsell.accepted, then order.updated. Each later page loads the order again and sends order.loaded.</desc>
  <defs>
    <marker id="orders-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--clean-fg-muted, #6b7280)" />
    </marker>
  </defs>
  <g>
    <rect x="8" y="4" width="116" height="27" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="66" y="22" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the checkout</text>
    <path d="M60 31 V130 H214" marker-end="url(#orders-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="72" y="46" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">paid at once</text>
    <text x="72" y="63" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">order.created</text>
    <text x="72" y="79" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">order.paid</text>
    <text x="72" y="96" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">redirected</text>
    <rect x="448" y="4" width="116" height="27" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="506" y="22" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the gateway</text>
    <path d="M500 31 V124 H446" marker-end="url(#orders-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="512" y="50" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">paid:</text>
    <text x="512" y="66" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">redirected to</text>
    <text x="512" y="82" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">the next page</text>
    <path d="M440 154 H534" marker-end="url(#orders-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; stroke-dasharray: 5 4" />
    <text x="490" y="146" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">fails</text>
    <path d="M330 168 V284" marker-end="url(#orders-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="226" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">the order arrives</text>
    <path d="M330 378 V444" marker-end="url(#orders-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="402.5" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">an upsell is added</text>
    <text x="344" y="422.5" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">upsell.accepted</text>
    <path d="M220 479 H170 V152 H214" marker-end="url(#orders-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; stroke-dasharray: 5 4" />
    <path d="M220 326 H170" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; stroke-dasharray: 5 4" />
    <text x="158" y="238" text-anchor="end" style="fill: var(--clean-fg, #111827); font-size: 13px">each later page</text>
  </g>
  <g text-anchor="middle">
    <rect x="220" y="110" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
    <text x="330" y="135" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">loading</text>
    <text x="330" y="155" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">ref_id in the URL</text>
    <rect x="220" y="290" width="220" height="88" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="315" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">loaded</text>
    <text x="330" y="335" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">order.loaded</text>
    <text x="330" y="350" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">order.paid</text>
    <text x="330" y="365" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">once, after a gateway</text>
    <rect x="220" y="450" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
    <text x="330" y="475" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">updated</text>
    <text x="330" y="495" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">order.updated</text>
    <rect x="540" y="110" width="160" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-rose-500, #e11d48); stroke-width: 1.5" />
    <text x="620" y="135" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">not loaded</text>
    <text x="620" y="155" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">sdk.error</text>
  </g>
</svg>
