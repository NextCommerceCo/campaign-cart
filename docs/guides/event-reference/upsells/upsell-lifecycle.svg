<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" width="720" height="770" role="img" aria-labelledby="upsells-lifecycle-title upsells-lifecycle-desc" style="font-family: var(--clean-font-body, system-ui, sans-serif)">
  <title id="upsells-lifecycle-title">Upsell lifecycle</title>
  <desc id="upsells-lifecycle-desc">On one upsell page, opened with the order’s ref_id. The page loads the order (order.loaded): an order that takes upsells shows the offer, next-available, and upsell.viewed comes once per offer, when half of it is on screen; one that does not, or cannot load (sdk.error), keeps it next-hidden. Accepting sends the offer to the order: next-processing. Added, next-success (upsell.accepted, then order.updated) and the next page opens after a tenth of a second. Declined (upsell.declined, payment.failed), refused, or no answer and the order loaded again does not have it (sdk.error, upsell.failed): next-error, and the next page opens after a second. With no answer and the order loaded again having the offer, it was added. Skipping is next-skipped (upsell.skipped) and opens the next page at once. The next page loads the order again.</desc>
  <defs>
    <marker id="upsells-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--clean-fg-muted, #6b7280)" />
    </marker>
  </defs>
  <g>
    <rect x="215" y="8" width="230" height="27" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="330" y="26" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the page loads the order</text>
    <path d="M330 35 V104" marker-end="url(#upsells-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="316" y="62" text-anchor="end" style="fill: var(--clean-fg, #111827); font-size: 13px">takes upsells</text>
    <text x="316" y="82" text-anchor="end" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">order.loaded</text>
    <path d="M445 21.5 H620 V104" marker-end="url(#upsells-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="610" y="45" text-anchor="end" style="fill: var(--clean-fg, #111827); font-size: 12px">does not take upsells</text>
    <text x="610" y="61" text-anchor="end" style="fill: var(--clean-fg, #111827); font-size: 12px">or cannot load</text>
    <text x="610" y="79" text-anchor="end" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">order.loaded, or sdk.error</text>
    <path d="M330 183 V284" marker-end="url(#upsells-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="233.5" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">accept</text>
    <path d="M440 150 H490 V310 H534" marker-end="url(#upsells-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="502" y="225" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">skip</text>
    <text x="502" y="243" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">upsell.skipped</text>
    <path d="M330 348 V435" marker-end="url(#upsells-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <path d="M330 441 L342 453 L330 465 L318 453 Z" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <path d="M330 465 V568" marker-end="url(#upsells-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="525" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">added, or no answer</text>
    <text x="344" y="543" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">and the order has it</text>
    <path d="M342 453 H534" marker-end="url(#upsells-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; stroke-dasharray: 5 4" />
    <text x="441" y="413" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">declined</text>
    <text x="441" y="429" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">upsell.declined</text>
    <text x="441" y="445" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">payment.failed</text>
    <text x="441" y="473" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">refused, or not on the order</text>
    <text x="441" y="490" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">sdk.error, upsell.failed</text>
    <path d="M330 647 V706" marker-end="url(#upsells-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="671" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">after a tenth of a second</text>
    <path d="M620 482 V706" marker-end="url(#upsells-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="608" y="542" text-anchor="end" style="fill: var(--clean-fg, #111827); font-size: 12px">after a second</text>
    <path d="M700 319 H712 V732 H706" marker-end="url(#upsells-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="700" y="562" text-anchor="end" style="fill: var(--clean-fg, #111827); font-size: 12px">at once</text>
    <rect x="220" y="712" width="480" height="42" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="460" y="730" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the next page</text>
    <text x="460" y="745" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">loads the order</text>
  </g>
  <g text-anchor="middle">
    <rect x="220" y="110" width="220" height="73" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-accent, #2563eb); stroke-width: 1.5" />
    <text x="330" y="135" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">next-available</text>
    <text x="330" y="155" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">upsell.viewed</text>
    <text x="330" y="170" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">once half of it is on screen</text>
    <rect x="220" y="290" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-amber-500, #f59e0b); stroke-width: 1.5" />
    <text x="330" y="315" style="fill: var(--clean-fg, #111827); font-size: 14px; font-weight: 600">next-processing</text>
    <text x="330" y="335" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">the offer is sent</text>
    <rect x="220" y="574" width="220" height="73" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="599" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">next-success</text>
    <text x="330" y="619" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">upsell.accepted</text>
    <text x="330" y="634" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">order.updated</text>
    <rect x="540" y="110" width="160" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
    <text x="620" y="135" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">next-hidden</text>
    <text x="620" y="155" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">the offer stays hidden</text>
    <rect x="540" y="290" width="160" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
    <text x="620" y="315" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">next-skipped</text>
    <text x="620" y="335" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">upsell.skipped</text>
    <rect x="540" y="424" width="160" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-rose-500, #e11d48); stroke-width: 1.5" />
    <text x="620" y="449" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">next-error</text>
    <text x="620" y="469" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">not added</text>
  </g>
</svg>
