<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 915" width="720" height="915" role="img" aria-labelledby="checkout-lifecycle-title checkout-lifecycle-desc" style="font-family: var(--clean-font-body, system-ui, sans-serif)">
  <title id="checkout-lifecycle-title">Checkout lifecycle</title>
  <desc id="checkout-lifecycle-desc">A checkout page opens and waits until the cart has lines. Then the checkout starts: checkout.started, once per checkout (a later step, a reload or a return from the gateway keeps it and sends nothing). While the shopper fills the form, user.created, user.updated, address.autofilled, address.entered, address.updated and payment.selected arrive in any order; a step of a multi-step form that passes its checks sends checkout.continued. A submit, or an express button, starts submitting: the cart is frozen while the form, the cart and the card are checked. A check that fails sends checkout.invalid and goes back to filling. Checks that pass send checkout.submitted and place the order. An order not placed sends sdk.error, then checkout.failed; a declined card sends payment.failed; both go back to filling. A created order sends order.created. Without a payment_complete_url it is paid at once: order.paid, checkout.completed, and the shopper is redirected to the next page. With one, payment.redirected, and the shopper pays at the gateway: paid, the next page loads the order (order.loaded, order.paid, checkout.completed); not paid, back to the checkout with the cart kept (payment.failed).</desc>
  <defs>
    <marker id="checkout-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--clean-fg-muted, #6b7280)" />
    </marker>
  </defs>
  <g>
    <rect x="250" y="4" width="160" height="27" rx="8" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.2; stroke-dasharray: 4 3" />
    <text x="330" y="22" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">a checkout page opens</text>
    <path d="M330 31 V64" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <path d="M330 128 V230" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="170.5" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">the cart has lines</text>
    <text x="344" y="190.5" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout.started</text>
    <text x="344" y="210" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">once per checkout</text>
    <path d="M330 294 V370" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="332" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">submit, or an express button</text>
    <path d="M220 405 H180 V280 H214" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; stroke-dasharray: 5 4" />
    <text x="168" y="334" text-anchor="end" style="fill: var(--clean-fg, #111827); font-size: 13px">a check fails</text>
    <text x="168" y="354" text-anchor="end" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout.invalid</text>
    <path d="M330 434 V550" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="483.5" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">the checks pass</text>
    <text x="344" y="503.5" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout.submitted</text>
    <path d="M220 585 H24 V263 H214" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; stroke-dasharray: 5 4" />
    <text x="36" y="444" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">not placed</text>
    <text x="36" y="464" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">sdk.error</text>
    <text x="36" y="481" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout.failed</text>
    <text x="36" y="509" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">card declined</text>
    <text x="36" y="529" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">payment.failed</text>
    <path d="M440 244 H470 V260 H446" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="482" y="250" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">a step passes</text>
    <text x="482" y="267" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout.continued</text>
    <path d="M660 661 V282 H446" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; stroke-dasharray: 5 4" />
    <text x="648" y="390" text-anchor="end" style="fill: var(--clean-fg, #111827); font-size: 12px">not paid: redirected back</text>
    <text x="648" y="407" text-anchor="end" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">payment.failed</text>
    <path d="M330 614 V672" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <path d="M330 678 L342 690 L330 702 L318 690 Z" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="316" y="644" text-anchor="end" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">order.created</text>
    <path d="M330 702 V820" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="766" style="fill: var(--clean-fg, #111827); font-size: 13px">no <tspan style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">payment_complete_url</tspan>: paid at once</text>
    <text x="344" y="784" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">then redirected to the next page</text>
    <path d="M342 690 H534" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="356" y="682" style="fill: var(--clean-fg, #111827); font-size: 13px">a <tspan style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">payment_complete_url</tspan></text>
    <text x="441" y="708" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">payment.redirected</text>
    <text x="441" y="725" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">redirected to it</text>
    <path d="M620 719 V855 H446" marker-end="url(#checkout-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="530" y="812" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">paid: on the next page</text>
    <text x="530" y="829" text-anchor="middle" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">order.loaded</text>
  </g>
  <g text-anchor="middle">
    <rect x="220" y="70" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
    <text x="330" y="95" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">waiting</text>
    <text x="330" y="115" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">until the cart has lines</text>
    <rect x="220" y="236" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-accent, #2563eb); stroke-width: 1.5" />
    <text x="330" y="261" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">filling</text>
    <text x="330" y="281" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">user, address, payment</text>
    <rect x="220" y="376" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-amber-500, #f59e0b); stroke-width: 1.5" />
    <text x="330" y="401" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">submitting</text>
    <text x="330" y="421" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">the cart is frozen</text>
    <rect x="220" y="556" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-amber-500, #f59e0b); stroke-width: 1.5" />
    <text x="330" y="581" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">placing</text>
    <text x="330" y="601" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">the order is sent</text>
    <rect x="220" y="826" width="220" height="73" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="851" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">paid</text>
    <text x="330" y="871" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">order.paid</text>
    <text x="330" y="886" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">checkout.completed</text>
    <rect x="540" y="661" width="160" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-amber-500, #f59e0b); stroke-width: 1.5" />
    <text x="620" y="686" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">at the gateway</text>
    <text x="620" y="706" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">see Payments</text>
  </g>
</svg>
