<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 502" width="720" height="502" role="img" aria-labelledby="checkout-user-lifecycle-title checkout-user-lifecycle-desc" style="font-family: var(--clean-font-body, system-ui, sans-serif)">
  <title id="checkout-user-lifecycle-title">User lifecycle</title>
  <desc id="checkout-user-lifecycle-desc">Lead capture. There is no user until the shopper has entered what data-next-lead asks for: by default a first and last name and an email. Then the checkout saves them with an Open Cart and sends user.created, once per tab. If saving fails it sends sdk.error and tries again when the shopper leaves the next field. After that, a change that is still valid sends user.updated; the Open Cart keeps the first details. With data-next-lead off it never saves.</desc>
  <defs>
    <marker id="checkout-user-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--clean-fg-muted, #6b7280)" />
    </marker>
  </defs>
  <g>
    <path d="M330 74 V190" marker-end="url(#checkout-user-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="132" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">the fields data-next-lead needs</text>
    <path d="M330 254 V370" marker-end="url(#checkout-user-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="312" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">saved</text>
    <path d="M440 214 H534" marker-end="url(#checkout-user-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="490" y="206" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">save fails</text>
    <path d="M620 196 V45 H446" marker-end="url(#checkout-user-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; stroke-dasharray: 5 4" />
    <text x="540" y="37" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">the next field</text>
    <path d="M440 394 H470 V418 H446" marker-end="url(#checkout-user-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="482" y="400" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 12px">details change</text>
    <text x="482" y="417" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">user.updated</text>
  </g>
  <g text-anchor="middle">
    <rect x="220" y="16" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
    <text x="330" y="41" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">no user yet</text>
    <text x="330" y="61" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">waiting for data-next-lead</text>
    <rect x="220" y="196" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-amber-500, #f59e0b); stroke-width: 1.5" />
    <text x="330" y="221" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">saving</text>
    <text x="330" y="241" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">the Open Cart is created</text>
    <rect x="220" y="376" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="401" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">created</text>
    <text x="330" y="421" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">user.created</text>
    <rect x="540" y="196" width="160" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-rose-500, #e11d48); stroke-width: 1.5" />
    <text x="620" y="221" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">not saved</text>
    <text x="620" y="241" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">user.save</text>
  </g>
  <text x="360" y="468" text-anchor="middle" style="font-size: 12px"><tspan style="fill: var(--clean-fg-muted, #6b7280)">Once per tab, kept across pages · data-next-lead="off" never saves</tspan></text>
  <text x="360" y="488" text-anchor="middle" style="font-size: 12px"><tspan style="fill: var(--color-rose-500, #e11d48); font-family: var(--clean-font-mono, ui-monospace, monospace)">sdk.error · user.save</tspan><tspan style="fill: var(--clean-fg-muted, #6b7280)"> → not saved yet; tried again on the next field</tspan></text>
</svg>
