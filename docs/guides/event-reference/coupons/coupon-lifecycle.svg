<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 482" width="720" height="482" role="img" aria-labelledby="coupons-lifecycle-title coupons-lifecycle-desc" style="font-family: var(--clean-font-body, system-ui, sans-serif)">
  <title id="coupons-lifecycle-title">Coupon lifecycle</title>
  <desc id="coupons-lifecycle-desc">A code is entered and checked against the cart. When it takes money off, or the cart is still empty, it is applied (coupon.applied, then cart.updated). When it takes nothing off it is denied (coupon.denied) and not kept. A code applied to an empty cart is checked after the first price and denied then if it takes nothing off (coupon.denied, cart.updated). Removing an applied code sends coupon.removed.</desc>
  <defs>
    <marker id="coupons-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--clean-fg-muted, #6b7280)" />
    </marker>
  </defs>
  <g>
    <path d="M330 74 V190" marker-end="url(#coupons-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="123.5" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">takes money off, or the cart is empty</text>
    <text x="344" y="143.5" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">cart.updated</text>
    <path d="M330 254 V370" marker-end="url(#coupons-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="344" y="303.5" text-anchor="start" style="fill: var(--clean-fg, #111827); font-size: 13px">removed</text>
    <text x="344" y="323.5" text-anchor="start" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">cart.updated</text>
    <path d="M440 34 H534" marker-end="url(#coupons-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5" />
    <text x="490" y="26" text-anchor="middle" style="fill: var(--clean-fg, #111827); font-size: 12px">no discount</text>
    <path d="M440 225 H620 V80" marker-end="url(#coupons-lifecycle-arrow)" style="fill: none; stroke: var(--clean-fg-muted, #6b7280); stroke-width: 1.5; stroke-dasharray: 5 4" />
    <text x="608" y="186" text-anchor="end" style="fill: var(--clean-fg, #111827); font-size: 12px">checked after the</text>
    <text x="608" y="202" text-anchor="end" style="fill: var(--clean-fg, #111827); font-size: 12px">first price</text>
  </g>
  <g text-anchor="middle">
    <rect x="220" y="16" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
    <text x="330" y="41" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">entered</text>
    <text x="330" y="61" style="fill: var(--clean-fg-muted, #6b7280); font-size: 12px">checked against the cart</text>
    <rect x="220" y="196" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-emerald-500, #10b981); stroke-width: 1.5" />
    <text x="330" y="221" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">applied</text>
    <text x="330" y="241" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">coupon.applied</text>
    <rect x="220" y="376" width="220" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--clean-border, #d7dce5); stroke-width: 1.5" />
    <text x="330" y="401" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">removed</text>
    <text x="330" y="421" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">coupon.removed</text>
    <rect x="540" y="16" width="160" height="58" rx="10" style="fill: var(--clean-bg-muted, #f4f6f9); stroke: var(--color-rose-500, #e11d48); stroke-width: 1.5" />
    <text x="620" y="41" style="fill: var(--clean-fg, #111827); font-size: 16px; font-weight: 600">denied</text>
    <text x="620" y="61" style="fill: var(--clean-accent, #2563eb); font-size: 12px; font-family: var(--clean-font-mono, ui-monospace, monospace)">coupon.denied</text>
  </g>
  <text x="360" y="468" text-anchor="middle" style="font-size: 12px"><tspan style="fill: var(--color-rose-500, #e11d48); font-family: var(--clean-font-mono, ui-monospace, monospace)">sdk.error · coupon.check</tspan><tspan style="fill: var(--clean-fg-muted, #6b7280)"> → the code is not applied; applyCoupon resolves false</tspan></text>
</svg>
