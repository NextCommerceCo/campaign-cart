name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The versioned docs site is one folder per released tag, and
          # src/tests/docs/docsVersions.test.ts asserts that index is well-formed.
          # actions/checkout fetches no tags by default, so the test read an empty
          # list and failed on every run since the versioned site landed.
          # scripts/docs-versions.mjs reads `git for-each-ref refs/tags`, so the refs
          # are all it needs — the default depth of 1 stays, no full history.
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test:coverage

      # Fails only on NEW documentation gaps; known gaps are frozen in
      # scripts/docs-coverage.baseline.json. See docs/documentation-plan.md.
      - name: Docs coverage
        run: bun run docs:coverage

      # Builds the docs site with every TypeDoc warning promoted to an error, so a
      # broken cross-link between guides cannot merge. Note it catches *relative*
      # links only — site-absolute ones are checked by docs:coverage above.
      - name: Docs link check
        run: bun run docs:check

      - name: Build
        run: bun run build
