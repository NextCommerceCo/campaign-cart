name: Deploy docs

# The site is one folder per release, plus `latest/` and `main/`. A Workers deploy
# replaces every file, so each run rebuilds the whole site: released folders come from
# the `docs-site.tar.gz` attached to each GitHub release, `main/` is built fresh. Publishing
# a release builds its folder, attaches it, and makes it `latest/`.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Assemble the site without deploying
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ github.event.release.tag_name }}
      LEGACY_TAG: v0.4.43
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The 0.4 docs are built from their tags once (scripts/docs-legacy.mjs), attached to
      # the last 0.4 release, and unpacked from there like every other release after that.
      - name: Check for the 0.4 docs
        id: legacy
        run: |
          if gh release view "$LEGACY_TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx docs-site.tar.gz; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.legacy.outputs.missing == 'true' }}
      - name: Build the 0.4 docs from their tags
        if: ${{ steps.legacy.outputs.missing == 'true' }}
        run: |
          node scripts/docs-legacy.mjs docs/site
          mkdir -p "$RUNNER_TEMP/legacy"
          (cd docs/site && tar czf "$RUNNER_TEMP/legacy/docs-site.tar.gz" v0.4.* latest)
      - name: Attach the 0.4 docs to ${{ env.LEGACY_TAG }}
        if: ${{ steps.legacy.outputs.missing == 'true' && !inputs.dry-run && (github.ref == 'refs/heads/main' || env.RELEASE) }}
        run: |
          gh release view "$LEGACY_TAG" >/dev/null 2>&1 \
            || gh release create "$LEGACY_TAG" --verify-tag --latest=false --title "$LEGACY_TAG" --notes ""
          gh release upload "$LEGACY_TAG" "$RUNNER_TEMP/legacy/docs-site.tar.gz" --clobber

      - name: Unpack released docs, oldest first so the newest latest/ wins
        run: |
          mkdir -p docs/site
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | sort -V | while read -r tag; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx docs-site.tar.gz; then
              rm -rf docs/site/latest
              gh release download "$tag" --pattern docs-site.tar.gz --output - | tar xz -C docs/site
            fi
          done

      - name: Build the release folder and latest/
        if: ${{ env.RELEASE }}
        run: |
          npm run docs:build -- "$RELEASE"
          rm -rf docs/site/latest
          npm run docs:build -- latest
          tar czf "$RUNNER_TEMP/docs-site.tar.gz" -C docs/site "$RELEASE" latest

      - name: Attach the docs to the release
        if: ${{ env.RELEASE && !inputs.dry-run }}
        run: gh release upload "$RELEASE" "$RUNNER_TEMP/docs-site.tar.gz" --clobber

      - run: npm run docs:build -- main
      - run: npm run docs:site -- --require-release
        env:
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}

      - name: Deploy to Cloudflare
        if: ${{ !inputs.dry-run && (github.ref == 'refs/heads/main' || env.RELEASE) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy -c docs/wrangler.jsonc
