name: Release

# Publishing a GitHub release finishes it: pages load the SDK from
# cdn.jsdelivr.net/gh/NextCommerceCo/campaign-cart@v<version>/dist, which reads the tagged
# tree, so the tag is moved to a commit off main that carries the built dist/, the dist
# zip is attached, and the docs are deployed. Run it by hand to finish a release again.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to finish, e.g. v0.5.0
        type: string
        required: true
      dry-run:
        description: Run every step but push nothing and deploy nothing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Start from the release's source commit
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a release tag (vX.Y.Z)"; exit 1; }
          # A finished release's tag already points at the dist/ commit; build from its parent.
          if git cat-file -e HEAD:dist 2>/dev/null; then git checkout --quiet --detach HEAD^; fi
          version="v$(node -p "require('./package.json').version")"
          [[ "$version" == "$TAG" ]] || { echo "::error::package.json is $version but the release is $TAG"; exit 1; }

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - run: npm run build

      - name: Tag a commit that carries dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force dist
          git commit --quiet -m "Release $TAG"
          git tag --force "$TAG"
          (cd dist && zip -qr "$RUNNER_TEMP/campaign-cart-$TAG.zip" .)

      - name: Move the tag and attach dist
        if: ${{ !inputs.dry-run }}
        run: |
          git push --force origin "refs/tags/$TAG"
          gh release upload "$TAG" "$RUNNER_TEMP/campaign-cart-$TAG.zip" --clobber

  docs:
    needs: release
    uses: ./.github/workflows/docs-deploy.yml
    with:
      release: ${{ github.event.release.tag_name || inputs.tag }}
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit
