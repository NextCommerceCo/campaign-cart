name: Release

# Releases package.json's version. Pages load the SDK from
# cdn.jsdelivr.net/gh/NextCommerceCo/campaign-cart@v<version>/dist, which reads the tagged
# tree, so the tag points at a commit off main that carries the built dist/.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every step but push nothing and deploy nothing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$tag is not a release version"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists; bump the version in package.json"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - run: npm run build

      - name: Tag a commit that carries dist/
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add --force dist
          git commit --quiet -m "Release $TAG"
          git tag "$TAG"

      - name: Push the tag and create the release
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "refs/tags/$TAG"
          (cd dist && zip -qr "$RUNNER_TEMP/campaign-cart-$TAG.zip" .)
          gh release create "$TAG" --verify-tag --generate-notes "$RUNNER_TEMP/campaign-cart-$TAG.zip"

  # A tag pushed with GITHUB_TOKEN starts no workflow, so the docs deploy is called here.
  docs:
    needs: release
    uses: ./.github/workflows/docs-deploy.yml
    with:
      release: ${{ needs.release.outputs.tag }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
